# What there is to watch here:
#
#   * landing/ — a Next.js site with a committed pnpm lockfile, so its versions
#     are frozen until something bumps them. This is the real reason this file
#     exists: Next and its friends ship security advisories, and the site is
#     public. Updates are grouped into one PR so it stays one review a month,
#     with majors kept separate since those are the ones that break a build.
#   * the workflows — only actions/checkout today, but GitHub retires action
#     runtimes periodically, and a stale major eventually stops running.
#
# The macOS app itself has no dependencies at all: no Package.swift, nothing
# under `packages:` in project.yml. Nothing to watch there, by design.
#
# `labels: []` is deliberate. Naming a label Dependabot can't find makes it
# comment on the PR asking you to create it, and an empty list is the only way
# to say "don't label these" — omitting the key falls back to the default
# `dependencies` label instead.

version: 2
updates:
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: landing
    labels: []
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: CI
    labels: []
